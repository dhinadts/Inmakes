name: mood_tracker
description: A mood analysis and emergency alert app using GetX.

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  get: ^4.6.6

  # Firebase
  firebase_core: ^2.29.0
  firebase_messaging: ^14.9.0
  cloud_firestore: ^4.17.1
  firebase_auth: ^5.9.0

  # Local notifications
  flutter_local_notifications: ^16.3.0

  # AdMob
  google_mobile_ads: ^5.1.0

  # Audio recording & permissions
  permission_handler: ^11.3.0
  flutter_sound: ^9.2.13
  path_provider: ^2.1.2

  # Chart for mood history
  fl_chart: ^0.67.0

  # UI utils
  flutter_screenutil: ^5.9.0
  responsive_framework: ^1.0.0

  # Storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
